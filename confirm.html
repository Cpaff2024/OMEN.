<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMEN - Thank You</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Roboto Mono', monospace; background-color: #000000; overflow: hidden; }
        .font-montserrat { font-family: 'Montserrat', sans-serif; }
        #background-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; opacity: 0.15; }
    </style>
</head>
<body class="text-white">

    <canvas id="background-canvas"></canvas>

    <main class="relative z-10 flex flex-col items-center justify-center min-h-screen p-4 text-center">

        <!-- This message shows AFTER they submit the details form -->
        <div id="success-message" class="hidden w-full max-w-md">
            <h1 class="font-montserrat font-black text-4xl md:text-6xl text-white">PROFILE UPDATED</h1>
            <p class="text-lg md:text-xl text-white/70 mt-4">Thank you. You're all set.</p>
            <a href="index.html" class="mt-8 inline-block text-white/50 hover:text-white underline">Back to home</a>
        </div>

        <!-- This form shows initially -->
        <div id="form-container" class="w-full max-w-md">
            <h1 class="font-montserrat font-black text-4xl md:text-6xl text-white">YOU'RE IN.</h1>
            <p class="text-lg md:text-xl text-white/70 mt-4 max-w-lg">
                To get our newsletter and exclusive content, complete your profile below.
            </p>
            <form id="details-form" action="https://formspree.io/f/mqayjbwz" method="POST" class="w-full mt-8">
                <div class="flex flex-col items-center gap-4">
                    <!-- This hidden field carries the email over for the submission -->
                    <input type="hidden" id="email-hidden" name="email">
                    
                    <input
                        id="firstName-input"
                        type="text"
                        name="First Name" 
                        placeholder="Enter your first name"
                        required
                        class="w-full px-5 py-4 text-sm text-center sm:text-left text-white bg-black border border-white/20 rounded-md focus:ring-2 focus:ring-white focus:outline-none transition-all duration-300 placeholder-white/40"
                    />
                    <div class="flex items-center gap-3 self-start">
                        <input type="checkbox" id="newsletter-consent" name="Newsletter Consent" value="Yes" class="w-5 h-5 bg-black border-white/30 rounded text-white focus:ring-white cursor-pointer" checked>
                        <label for="newsletter-consent" class="text-sm text-white/70 cursor-pointer">Yes, send me the OMEN newsletter.</label>
                    </div>

                    <!-- IMPORTANT: This hidden field tells Formspree where to redirect after submission -->
                    <input type="hidden" name="_next" id="next-url-input" value="">
                    
                    <button id="submit-button-details" type="submit" class="w-full px-8 py-4 bg-white text-black font-bold rounded-md hover:bg-white/80 transition-colors duration-300 whitespace-nowrap">
                        COMPLETE SIGNUP
                    </button>
                </div>
            </form>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const email = urlParams.get('email');
            
            // Populate the hidden email field
            if (email) {
                document.getElementById('email-hidden').value = email;
            } else if (!urlParams.has('success')) {
                // If there's no email AND it's not a success redirect, show an error.
                document.getElementById('form-container').innerHTML = '<p class="text-white/70">Error: Could not find email. Please sign up again.</p><a href="index.html" class="mt-4 inline-block text-white/50 hover:text-white underline">Back to home</a>';
            }

            // Set the redirect URL for the form to this page, but with a success flag
            const successUrl = window.location.origin + window.location.pathname + '?success=true';
            document.getElementById('next-url-input').value = successUrl;

            // Check if Formspree redirected here with a success message
            if (urlParams.has('success')) {
                document.getElementById('form-container').classList.add('hidden');
                document.getElementById('success-message').classList.remove('hidden');
            }
        });

        // --- Animated background (same as index page) ---
        const canvas = document.getElementById('background-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const characters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
        const fontSize = 16;
        const columns = Math.floor(canvas.width / fontSize);
        const drops = Array(columns).fill(1);
        function drawBackground() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.04)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#FFFFFF';
            ctx.font = `${fontSize}px Roboto Mono`;
            for (let i = 0; i < drops.length; i++) {
                const text = characters.charAt(Math.floor(Math.random() * characters.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) { drops[i] = 0; }
                drops[i]++;
            }
        }
        setInterval(drawBackground, 33);
    </script>
</body>
</html>
