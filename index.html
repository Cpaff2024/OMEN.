<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMEN - Join The Project</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* Custom styles to extend Tailwind */
        body {
            font-family: 'Roboto Mono', monospace;
            background-color: #000000;
            overflow: hidden; /* Hide scrollbars */
        }
        .font-montserrat {
            font-family: 'Montserrat', sans-serif;
        }
        #background-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.15;
        }
        .logo {
            font-size: clamp(3rem, 15vw, 10rem); /* Responsive font size */
            letter-spacing: -0.05em;
        }
        .content-container {
            z-index: 1;
            position: relative;
        }
    </style>
</head>
<body class="text-white">

    <!-- Animated Background Canvas -->
    <canvas id="background-canvas"></canvas>

    <!-- Main Content -->
    <main class="content-container flex flex-col items-center justify-center min-h-screen p-4 text-center">

        <!-- Logo -->
        <h1 class="font-montserrat font-black logo text-white animate-fade-in-slow">OMEN<span class="text-white/80">.</span></h1>

        <!-- Subtitle -->
        <p class="text-lg md:text-xl text-white/70 mt-4 max-w-lg animate-fade-in-delay">
            A project for those who are ready to stop reacting to life and start designing it.
            Join the waitlist to be the first to know when we launch.
        </p>

        <!-- Waitlist Form -->
        <form id="waitlist-form" action="https://formspree.io/f/mqayjbwz" method="POST" class="w-full max-w-md mt-8 animate-fade-in-delay-2">
            <div class="flex flex-col sm:flex-row items-center gap-3">
                <input
                    id="email-input"
                    type="email"
                    name="email" 
                    placeholder="Enter your email address"
                    required
                    class="w-full px-5 py-4 text-sm text-center sm:text-left text-white bg-black border border-white/20 rounded-md focus:ring-2 focus:ring-white focus:outline-none transition-all duration-300 placeholder-white/40"
                />
                <button id="submit-button" type="submit" class="w-full sm:w-auto px-8 py-4 bg-white text-black font-bold rounded-md hover:bg-white/80 transition-colors duration-300 whitespace-nowrap">
                    JOIN WAITLIST
                </button>
            </div>
             <!-- This hidden field tells Formspree where to redirect after submission -->
             <!-- IMPORTANT: Replace with your FULL live URL for the confirm page -->
            <input type="hidden" name="_next" value="https://YOUR_GITHUB_USERNAME.github.io/YOUR_REPO_NAME/confirm.html">
        </form>


        <!-- Countdown Timer -->
        <div id="countdown-container" class="mt-12 animate-fade-in-delay-3">
            <div id="timer" class="flex items-center justify-center gap-4 md:gap-8">
                <div class="flex flex-col items-center">
                    <span id="days" class="text-4xl md:text-6xl font-bold tracking-wider">00</span>
                    <span class="text-sm text-white/50">DAYS</span>
                </div>
                 <span class="text-4xl md:text-6xl font-bold text-white/50">:</span>
                <div class="flex flex-col items-center">
                    <span id="hours" class="text-4xl md:text-6xl font-bold tracking-wider">00</span>
                    <span class="text-sm text-white/50">HOURS</span>
                </div>
                 <span class="text-4xl md:text-6xl font-bold text-white/50">:</span>
                <div class="flex flex-col items-center">
                    <span id="minutes" class="text-4xl md:text-6xl font-bold tracking-wider">00</span>
                    <span class="text-sm text-white/50">MINS</span>
                </div>
                 <span class="text-4xl md:text-6xl font-bold text-white/50">:</span>
                <div class="flex flex-col items-center">
                    <span id="seconds" class="text-4xl md:text-6xl font-bold tracking-wider">00</span>
                    <span class="text-sm text-white/50">SECS</span>
                </div>
            </div>
            <div id="countdown-end-message" class="hidden text-3xl font-bold text-white mt-4">
                THE PROJECT IS LIVE.
            </div>
        </div>

        <!-- Social Links -->
        <div class="flex items-center justify-center gap-6 mt-16 animate-fade-in-delay-4">
            <a href="https://www.instagram.com/weareomenmedia/" target="_blank" class="text-white/50 hover:text-white transition-colors duration-300" aria-label="Instagram">
                <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>
            </a>
            <a href="https://www.tiktok.com/@weareomenmedia" target="_blank" class="text-white/50 hover:text-white transition-colors duration-300" aria-label="TikTok">
                <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 448 512" fill="currentColor">
                    <path d="M448,209.91a210.06,210.06,0,0,1-122.77-39.25V349.38A162.55,162.55,0,1,1,185,188.31V278.2a74.62,74.62,0,1,0,52.23,71.18V0l88,0a121.18,121.18,0,0,0,1.86,22.17h0A122.18,122.18,0,0,0,381,102.39a121.43,121.43,0,0,0,67,20.14Z"/>
                </svg>
            </a>
            <a href="https://www.youtube.com/@WeAreOmenMedia" target="_blank" class="text-white/50 hover:text-white transition-colors duration-300" aria-label="YouTube">
                <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22.54 6.42a2.78 2.78 0 0 0-1.94-2C18.88 4 12 4 12 4s-6.88 0-8.6.46a2.78 2.78 0 0 0-1.94 2A29 29 0 0 0 1 11.75a29 29 0 0 0 .46 5.33A2.78 2.78 0 0 0 3.4 19c1.72.46 8.6.46 8.6.46s6.88 0 8.6-.46a2.78 2.78 0 0 0 1.94-2 29 29 0 0 0 .46-5.25 29 29 0 0 0-.46-5.33z"></path><polygon points="9.75 15.02 15.5 11.75 9.75 8.48 9.75 15.02"></polygon></svg>
            </a>
        </div>
    </main>

    <script>
        // --- Animated Background ---
        const canvas = document.getElementById('background-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const characters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
        const fontSize = 16;
        const columns = Math.floor(canvas.width / fontSize);
        const drops = Array(columns).fill(1);
        function drawBackground() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.04)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#FFFFFF';
            ctx.font = `${fontSize}px Roboto Mono`;
            for (let i = 0; i < drops.length; i++) {
                const text = characters.charAt(Math.floor(Math.random() * characters.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) { drops[i] = 0; }
                drops[i]++;
            }
        }
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            const newColumns = Math.floor(canvas.width / fontSize);
            drops.length = 0;
            drops.length = newColumns;
            drops.fill(1);
        });

        // --- STATIC Countdown Timer ---
        function startCountdown() {
            const countDownDate = new Date('2025-10-31T23:59:59Z').getTime();
            const timerInterval = setInterval(() => {
                const now = new Date().getTime();
                const distance = countDownDate - now;
                if (distance < 0) {
                    clearInterval(timerInterval);
                    document.getElementById('timer').classList.add('hidden');
                    document.getElementById('countdown-end-message').classList.remove('hidden');
                    return;
                }
                const days = Math.floor(distance / (1000 * 60 * 60 * 24));
                const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((distance % (1000 * 60)) / 1000);
                const pad = (num) => (num < 10 ? '0' + num : num);
                document.getElementById('days').innerText = pad(days);
                document.getElementById('hours').innerText = pad(hours);
                document.getElementById('minutes').innerText = pad(minutes);
                document.getElementById('seconds').innerText = pad(seconds);
            }, 1000);
        }

        // --- Animations ---
        function addTailwindAnimations() {
            const style = document.createElement('style');
            style.innerHTML = `
                @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
                .animate-fade-in-slow { animation: fadeIn 1.5s ease-out forwards; }
                .animate-fade-in-delay { animation: fadeIn 1.5s ease-out 0.5s forwards; opacity: 0; }
                .animate-fade-in-delay-2 { animation: fadeIn 1.5s ease-out 1s forwards; opacity: 0; }
                .animate-fade-in-delay-3 { animation: fadeIn 1.5s ease-out 1.5s forwards; opacity: 0; }
                .animate-fade-in-delay-4 { animation: fadeIn 1.5s ease-out 2s forwards; opacity: 0; }
            `;
            document.head.appendChild(style);
        }

        // --- Initialize ---
        document.addEventListener('DOMContentLoaded', () => {
            setInterval(drawBackground, 33);
            startCountdown();
            addTailwindAnimations();
        });
    </script>
</body>
</html>
